<div class="home-page">

  <section class="hero">

    <div class="hero-content">

      <div class="hero-badge">
        RESTAURANT REVIEWS
      </div>

      <h1>
        Find your next
        <span>favorite restaurant.</span>
      </h1>

      <p>
        Discover the best restaurants around you,
        read reviews and share your experience.
      </p>


      <!-- Search -->
      <div class="search-container">

        <div class="search-field">

          <span class="search-icon">⌕</span>

          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Restaurant, cuisine..."
          />

        </div>


        <div class="location-field">

          <span>📍</span>

          <input
            type="text"
            [(ngModel)]="location"
            placeholder="Paris"
          />

        </div>


        <button
          class="search-button"
          (click)="searchRestaurants()"
        >
          Search
        </button>

      </div>

    </div>

  </section>


  <!-- Popular cuisines -->

  <section class="popular">

    <h2>Popular cuisines</h2>

    <p>Explore restaurants by cuisine</p>


    <div class="cuisine-list">

      <button
        *ngFor="let cuisine of cuisines"
        (click)="searchCuisine(cuisine)"
      >
        {{ cuisine }}
      </button>

    </div>

  </section>

</div>
