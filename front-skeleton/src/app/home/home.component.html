
<section class="hero-carousel">
  <div
    *ngFor="let image of heroImages; let i = index"
    class="hero-slide"
    [class.active]="i === activeSlide"
    [style.background-image]="'url(&quot;' + image + '&quot;) '"
  ></div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <span class="hero-eyebrow">BONAPPÉTIT · PARIS</span>

    <h1>Every meal tells<br />a story.</h1>

    <p>
      Discover exceptional restaurants, explore new flavours,
      and share your favourite experiences.
    </p>

    <button
      class="discover-button"
      type="button"
      routerLink="/restaurants"
    >
      Explore restaurants <span>→</span>
    </button>

    <div class="carousel-indicators">
      <button
        *ngFor="let image of heroImages; let i = index"
        type="button"
        [class.active]="i === activeSlide"
        [attr.aria-label]="'Show slide ' + (i + 1)"
        (click)="activeSlide = i"
      ></button>
    </div>
  </div>

  <div class="hero-caption">
    <span>GOOD FOOD. GOOD MOMENTS.</span>
    <span>PARIS, FRANCE</span>
  </div>
</section>
