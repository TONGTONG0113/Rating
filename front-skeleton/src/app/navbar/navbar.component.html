<header class="navbar">

  <a
    class="brand"
    routerLink="/"
  >
    <div class="brand-icon">
      R
    </div>

    <div class="brand-text">
      <strong>Rating</strong>
      <span>Restaurant reviews</span>
    </div>
  </a>

  <nav class="nav-links">

    <a
      *ngFor="let link of links"
      [routerLink]="link.href"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.href === '/' }"
    >
      {{ link.name }}
    </a>

  </nav>

</header>
