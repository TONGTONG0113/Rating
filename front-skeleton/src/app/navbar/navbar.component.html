<header class="navbar">

  <a
    class="brand"
    routerLink="/"
  >
    <div class="brand-logo">
      <img src="assets/images.png" alt="Doraemon" />
    </div>

    <div class="brand-text">
      <strong>BonAppétit</strong>
      
    </div>
  </a>

  <nav class="nav-links">

    <a
      *ngFor="let link of links"
      [routerLink]="link.href"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.href === '/' }"
    >
      {{ link.name }}
    </a>

  </nav>

</header>
